<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🐱%3C/text%3E%3C/svg%3E">
<style>
:root{--pink:#ff7eb6;--pink2:#ffb3d4;--bg:#fff0f7;--card:#fff;--ink:#5a2a47;--lav:#c9b6ff;--mint:#a8ecd0;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(#ffe3f1,#f1e6ff);color:var(--ink);min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:12px 14px 180px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pill{background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 2px 6px #ff7eb633;font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #ff7eb622}
h2{margin:0 0 8px;font-size:18px}
button{font:inherit;border:0;border-radius:99px;padding:10px 16px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}
button.alt{background:var(--lav)} button.ghost{background:#ffe3f1;color:var(--ink)}
input,select{font:inherit;padding:10px 12px;border:2px solid var(--pink2);border-radius:14px;width:100%;margin:4px 0;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:14px;background:#ffe3f1;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .5s}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:2px;padding:6px;box-shadow:0 -4px 14px #ff7eb633}
nav button{background:none;color:var(--ink);padding:6px 10px;font-size:12px;border-radius:14px;display:flex;flex-direction:column;align-items:center;min-width:56px}
nav button span{font-size:22px}
nav button.on{background:#ffe3f1;color:var(--pink)}
.pet{text-align:center;position:relative}
.pet .bun{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 4px 8px #ff7eb655);font-size:92px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite;cursor:pointer;position:relative}
.pet .hat{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:44px}
@keyframes bob{50%{transform:translateY(-8px)}}
.pet .bun.dance{animation:dance 2.6s ease-in-out 1}
@keyframes dance{0%{transform:rotate(0)}10%{transform:translateY(-22px) rotate(-14deg)}20%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(14deg)}40%{transform:translateY(0) rotate(0)}55%{transform:scale(1.15,.9) rotate(-8deg)}65%{transform:scale(.9,1.15) rotate(8deg)}75%{transform:translateY(-30px) rotate(360deg)}90%{transform:translateY(0) rotate(360deg)}100%{transform:rotate(360deg)}}
/* roaming kitten */
#kitty{position:fixed;left:0;bottom:60px;width:140px;height:100px;z-index:6;pointer-events:none;will-change:transform}
#kdance{position:relative;width:140px;height:100px;pointer-events:auto;cursor:pointer;transform-origin:70px 95px}
#kflip{width:140px;height:100px}
#khat{position:absolute;top:-14px;font-size:34px;pointer-events:none}
#ksay{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--pink2);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
#ksay.on{opacity:1}
#kdance.walk{animation:kbob .42s ease-in-out infinite}
#kdance.pounce{animation:kpounce .5s ease-out 1}
#kdance.dance{animation:dance 2.6s ease-in-out 1}
@keyframes kbob{50%{transform:translateY(-3px)}}
@keyframes kpounce{0%{transform:scale(1.1,.85)}50%{transform:translate(0,-26px) scale(.95,1.1)}100%{transform:none}}
.leg.bf{transform-origin:57px 66px}.leg.ff{transform-origin:95px 66px}.leg.bl{transform-origin:40px 66px}.leg.fl{transform-origin:82px 66px}
.walk .leg.lA{animation:lg .42s ease-in-out infinite}.walk .leg.lB{animation:lg .42s ease-in-out infinite -.21s}
@keyframes lg{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
.tail{transform-origin:28px 58px;animation:tl 1.8s ease-in-out infinite}
@keyframes tl{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
.eyes{transform-origin:106px 43px;animation:blink 4.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
/* gym mode: gear + props + per-activity animation */
.gear,.prop{display:none}
#kitty.fit .gear{display:inline}
#kitty[data-act=run] .p-tread,#kitty[data-act=walk] .p-tread,#kitty[data-act=strength] .p-dumb,#kitty[data-act=yoga] .p-mat,#kitty[data-act=stretch] .p-mat,#kitty[data-act=cycle] .p-bike,#kitty[data-act=swim] .p-swim{display:inline}
#kdance.act{transform-origin:70px 95px}
#kitty[data-act=strength] #kdance.act{animation:ksquat 1.2s ease-in-out infinite alternate}
#kitty[data-act=run] #kdance.act{animation:kbob .26s ease-in-out infinite}
#kitty[data-act=walk] #kdance.act{animation:kbob .55s ease-in-out infinite}
#kitty[data-act=cycle] #kdance.act{animation:kbob .6s ease-in-out infinite}
#kitty[data-act=swim] #kdance.act{animation:kswim 1.2s ease-in-out infinite alternate}
#kitty[data-act=yoga] #kdance.act{animation:kyoga 4s ease-in-out infinite}
#kitty[data-act=stretch] #kdance.act{animation:kstretch 3.2s ease-in-out infinite}
#kitty[data-act=dance] #kdance.act{animation:dance 2.6s ease-in-out infinite}
@keyframes ksquat{to{transform:translateY(5px) scale(1.03,.95)}}
@keyframes kswim{to{transform:translateY(4px) rotate(-3deg)}}
@keyframes kyoga{50%{transform:translateY(-8px) scale(1.05) rotate(-3deg)}}
@keyframes kstretch{0%,100%{transform:none}40%,60%{transform:rotate(9deg) scale(1.1,.88)}}
#kitty[data-act=run] .leg.lA{animation:lg .26s ease-in-out infinite}#kitty[data-act=run] .leg.lB{animation:lg .26s ease-in-out infinite -.13s}
#kitty[data-act=walk] .leg.lA{animation:lg .55s ease-in-out infinite}#kitty[data-act=walk] .leg.lB{animation:lg .55s ease-in-out infinite -.27s}
#kitty[data-act=cycle] .leg.lA{animation:lg .6s ease-in-out infinite}#kitty[data-act=cycle] .leg.lB{animation:lg .6s ease-in-out infinite -.3s}
#kitty[data-act=swim] .leg.lA{animation:lg .45s ease-in-out infinite}#kitty[data-act=swim] .leg.lB{animation:lg .45s ease-in-out infinite -.22s}
.belt{animation:belt .3s linear infinite}#kitty[data-act=walk] .belt{animation-duration:.7s}
@keyframes belt{to{stroke-dashoffset:-16}}
.db{animation:curl 1.2s ease-in-out infinite alternate}
@keyframes curl{to{transform:translateY(-26px)}}
.spin{animation:sp .6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.wave{animation:wv 1.2s linear infinite}@keyframes wv{to{transform:translateX(-20px)}}
/* food search results + barcode scanner */
.fr{padding:8px 10px;border-radius:12px;background:#fff7fb;border:1px solid #ffd0e6;margin:6px 0;cursor:pointer;font-size:14px}
.fr:active{background:var(--pink2)}
#scanov{position:fixed;inset:0;background:#000000dd;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanbox{position:relative;width:min(90vw,420px);aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:3px solid var(--pink);background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
#ball{position:fixed;left:0;bottom:60px;width:30px;height:30px;font-size:26px;line-height:30px;text-align:center;z-index:5;cursor:pointer;user-select:none}
#arena{position:relative;height:300px;margin-top:10px;background:#fff7fb;border:2px dashed var(--pink2);border-radius:18px;overflow:hidden}
.fall{position:absolute;top:-44px;font-size:34px;cursor:pointer;user-select:none;animation:fall linear forwards}
@keyframes fall{to{top:310px}}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#ffe3f1;color:var(--ink)}
.opt.good{background:var(--mint)}.opt.bad{background:#ffb3b3}
.bub{border-radius:50%;aspect-ratio:1;background:radial-gradient(#fff,var(--lav));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--ink);cursor:pointer;user-select:none}
.bub.gone{visibility:hidden}
.pad{opacity:.45;transition:all .15s}.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 18px #fff}
.bubble{background:#ffe3f1;border-radius:16px;padding:8px 12px;display:inline-block;margin-top:6px;font-size:14px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #ffd0e6}
.quest:last-child{border:0}
.quest .ck{font-size:22px}.done{opacity:.55;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#ffe3f1;color:var(--ink);padding:7px 12px;font-size:14px}
.chip.on{background:var(--pink);color:#fff}
.glass{font-size:30px;cursor:pointer;filter:grayscale(1) opacity(.4)}.glass.f{filter:none}
.mood{font-size:36px;cursor:pointer;padding:4px;border-radius:14px}.mood.on{background:var(--pink2)}
.log{font-size:14px;padding:6px 0;border-bottom:1px dashed #ffd0e6;display:flex;justify-content:space-between}
#breath{width:140px;height:140px;border-radius:50%;margin:16px auto;background:radial-gradient(var(--lav),var(--pink2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;transition:transform 4s ease-in-out}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:16px;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;user-select:none}
.tile.up{background:#fff;border:2px solid var(--pink2)}.tile.ok{background:var(--mint)}
.badge{display:inline-block;text-align:center;width:30%;margin:6px 1%;vertical-align:top;font-size:12px}
.badge .e{font-size:34px}.badge.lock{filter:grayscale(1) opacity(.35)}
.shop{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--pink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;transition:transform .4s;z-index:9;box-shadow:0 4px 14px #0003;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.small{font-size:13px;opacity:.75}
</style>
</head>
<body>
<div id="app"></div>
<div id="ball">🧶</div>
<div id="kitty">
  <div id="ksay"></div>
  <div id="kdance">
    <div id="kflip">
      <svg viewBox="0 0 140 100" width="140" height="100" aria-label="Fluffy kitten">
        <defs><filter id="fuzz" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>

          <g class="spin" style="transform-origin:30px 80px"><path d="M30 68 V92 M18 80 H42" stroke-width="1.5"/></g><g class="spin" style="transform-origin:108px 80px"><path d="M108 68 V92 M96 80 H120" stroke-width="1.5"/></g></g>

        <g class="leg lB ff"><rect x="90" y="64" width="11" height="26" rx="5.5" fill="#f2b87a"/><ellipse cx="95.5" cy="90" rx="8" ry="4.5" fill="#ffe6cc"/><rect class="gear" x="90" y="72" width="11" height="4" fill="#ff7eb6"/><ellipse class="gear" cx="95.5" cy="90" rx="8.5" ry="4.8" fill="#ff7eb6"/><path class="gear" d="M90 90 h11" stroke="#fff" stroke-width="1.5"/></g>

        </g>
        <g class="gear"><path d="M48 38 Q62 32 78 38 L80 70 Q62 76 46 70Z" fill="#ff7eb6"/><path d="M52 44 Q62 41 74 44 M52 52 Q62 49 76 52" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

<script>
// ---------- data ----------
const KEY='glowup.v1';
const today=()=>new Date().toLocaleDateString('en-CA');
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'Bloom',xp:0,gems:0,streak:0,last:'',days:{},owned:[],hat:'',badges:[],bonusDays:[]};
S.profile=S.profile||{age:'',ft:'',inch:'',sex:'f',act:1.375,goal:0,calOverride:''};S.weights=S.weights||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
// targets: Mifflin-St Jeor (lbs/inches in, metric inside). Estimates only, not medical advice.
const mealCal=m=>+(m.cal??m.c)||0;
function lastWeight(){return S.weights.length?S.weights[S.weights.length-1].w:null}
function targets(){
  const p=S.profile,w=lastWeight();let cal=null,auto=false;
  if(w&&p.age&&p.ft){
    const kg=w*0.45359,cm=((+p.ft)*12+(+p.inch||0))*2.54;
    const bmr=10*kg+6.25*cm-5*(+p.age)+(p.sex==='m'?5:-161);
    cal=Math.round((bmr*p.act+(+p.goal))/10)*10;cal=Math.max(cal,p.sex==='m'?1500:1200);auto=true;
  }
  if(+p.calOverride>0){cal=+p.calOverride;auto=false}
  if(!cal)return null;
  return{cal,auto,p:Math.round(cal*.25/4),c:Math.round(cal*.45/4),f:Math.round(cal*.30/9),fi:25};
}
function totals(d){return d.meals.reduce((a,m)=>({cal:a.cal+mealCal(m),p:a.p+(+m.p||0),c:a.c+(+m.cb||0),f:a.f+(+m.f||0),fi:a.fi+(+m.fi||0)}),{cal:0,p:0,c:0,f:0,fi:0})}
const D=()=>S.days[today()]||(S.days[today()]={workouts:[],meals:[],water:0,mood:null,gratitude:'',breath:0,games:0,plays:{}});
const level=xp=>Math.floor(Math.sqrt(xp/40))+1;
const lvlStart=l=>(l-1)**2*40;
const TITLES=['Sprout','Sparkle','Starlet','Glow Getter','Icon','Goddess','Legend'];

const AFFIRM=["You are doing better than you think. 💕","Strong, soft, and unstoppable. 🌸","Rest is productive too. 🌙","Your body is your home. Be kind to it. 🏡","Progress, not perfection. ✨","You deserve to feel good today. 🦋","Small steps still count. 🐾","You are enough, exactly as you are. 💖"];
const WORKOUTS=[['💃','Dance',6],['🧘','Yoga',4],['🏃‍♀️','Run',9],['🚶‍♀️','Walk',4],['🏋️‍♀️','Strength',8],['🚴‍♀️','Cycle',7],['🏊‍♀️','Swim',9],['🤸‍♀️','Stretch',3]];
const FOODS=['🥦 Veggies','🍓 Fruit','🍗 Protein','🍚 Carbs','🥑 Healthy fat','🍫 Treat'];
const MOODS=[['😭','Rough'],['😟','Low'],['😐','Okay'],['😊','Good'],['🥰','Great']];
const SHOP=[['🎀','Bow',20],['👑','Crown',60],['🌸','Flower',30],['🕶️','Shades',40],['🎩','Top hat',50],['👒','Sun hat',35]];
const BADGES=[
 ['🌱','First Step',s=>Object.values(s.days).some(d=>d.workouts.length)],
 ['🔥','3-Day Streak',s=>s.streak>=3],['💎','7-Day Streak',s=>s.streak>=7],
 ['💧','Hydration Hero',s=>Object.values(s.days).some(d=>d.water>=8)],
 ['🥗','Fuel Fan',s=>Object.values(s.days).filter(d=>d.meals.length).length>=3],
 ['🧘','Zen Mode',s=>Object.values(s.days).some(d=>d.breath>0)],
 ['🃏','Game Girl',s=>Object.values(s.days).some(d=>d.games>0)],
 ['⭐','Level 5',s=>level(s.xp)>=5],['👑','Perfect Day',s=>s.bonusDays.length>0]];

// ---------- core ----------
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function touchStreak(){
  const t=today();if(S.last===t)return;
  S.streak=S.last===dayOffset(-1)?S.streak+1:1;S.last=t;
}
function award(xp,gems=0,msg=''){
  const before=level(S.xp);touchStreak();
  S.xp+=xp;S.gems+=gems;
  let m=`${msg} +${xp} XP${gems?` +${gems}💎`:''}`;
  const after=level(S.xp);if(after>before)m+=`\n🎉 Level ${after}!`;
  const q=quests();
  if(q.every(x=>x.done)&&!S.bonusDays.includes(today())){S.bonusDays.push(today());S.xp+=30;S.gems+=10;m+='\n🌟 Perfect day! +30 XP +10💎'}
  BADGES.forEach(([e,n,f])=>{if(!S.badges.includes(n)&&f(S)){S.badges.push(n);m+=`\n${e} Badge: ${n}`}});
  save();toast(m);render();
}

// ---------- roaming kitten ----------
const $k=id=>document.getElementById(id);
const K={x:120,dir:1,mode:'rest',until:0,kind:'wander',tx:null,t:performance.now()};
const B={x:260,y:0,vx:0,vy:0};
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const floorY=()=>$k('nav').offsetHeight-4;
let sayT;
function kSay(m){const e=$k('ksay');e.textContent=m;e.classList.add('on');clearTimeout(sayT);sayT=setTimeout(()=>e.classList.remove('on'),2200)}
function kHat(){const h=$k('khat');h.textContent=S.hat||'';h.style.left=(K.dir>0?89:19)+'px'}
function kMode(m,ms=0){if(m==='walk'&&K.mode!=='walk')K.since=K.t;K.mode=m;K.until=K.t+ms;const d=$k('kdance');d.className=m==='work'?'act':(m==='walk'||m==='pounce'||m==='dance'?m:'');
  if(m!=='work')$k('kitty').removeAttribute('data-act');
  if(m==='pounce'||m==='dance'){void d.offsetWidth;d.className=m}}
function kDance(msg){kMode('dance',2800);kSay(msg||'Yay! 💃')}
const ACTSAY={dance:'Dance party! 💃',yoga:'Namaste... 🧘',run:'Zoom zoom! 🏃‍♀️',walk:'Nice stroll 🚶‍♀️',strength:'Lift! 💪',cycle:'Pedal pedal! 🚴‍♀️',swim:'Splash! 🏊‍♀️',stretch:'Ahhh, stretchy 🤸‍♀️'};
function kAct(say){if(K.mode!=='work')return;const n=WORKOUTS[selW][1].toLowerCase();$k('kitty').dataset.act=n;if(say)kSay(ACTSAY[n])}
function kWork(){K.dir=1;$k('kflip').style.transform='scaleX(1)';kHat();kMode('work',1e12);kAct(true)}
function kPick(){
  if(tab==='move'){K.kind='gym';kMode('walk');return}
  const f=[...document.querySelectorAll('.fall')].filter(e=>!e.dead);
  if(f.length){K.kind='fall';return}
  K.kind=Math.random()<.55?'ball':'wander';K.tx=K.kind==='wander'?70+Math.random()*(innerWidth-140):null;kMode('walk')}
// targets are clamped to where the kitten can actually stand, so things near the edges stay reachable
const kClamp=v=>Math.max(70,Math.min(innerWidth-70,v));
function kTarget(){
  if(K.kind==='ball')return kClamp(B.x+15);
  if(K.kind==='fall'){let best=null;document.querySelectorAll('.fall').forEach(e=>{if(e.dead)return;const r=e.getBoundingClientRect();if(!best||r.bottom>best.bottom)best=r});
    return best?kClamp(best.left+best.width/2):(K.kind='wander',kClamp(K.tx??K.x))}
  if(K.kind==='gym')return innerWidth/2;
  return kClamp(K.tx)}
function tick(now){
  const dt=Math.min(.05,(now-K.t)/1000);K.t=now;const W=innerWidth;
  // yarn ball physics
  B.vy-=900*dt;B.y+=B.vy*dt;B.x+=B.vx*dt;
  if(B.y<=0){B.y=0;B.vy=Math.abs(B.vy)>60?-B.vy*.5:0;B.vx*=1-1.4*dt}
  if(B.x<0){B.x=0;B.vx=Math.abs(B.vx)*.7}if(B.x>W-30){B.x=W-30;B.vx=-Math.abs(B.vx)*.7}
  const b=$k('ball');b.style.bottom=(floorY()+B.y)+'px';b.style.transform=`translateX(${B.x}px) rotate(${B.x*2}deg)`;
  // kitten brain
  const want=tab==='move',kt=$k('kitty');
  if(want!==!!K.fit){K.fit=want;kt.classList.toggle('fit',want);kSay(want?'Outfit change! ✨ Gym time 💪':'Back to cozy 🐾')}
  if(!want&&K.mode==='work'){kPick();if(K.mode!=='walk')kMode('walk')}
  if(want&&K.mode==='walk'&&K.kind!=='gym')K.kind='gym';
  // safety net: never chase one thing for more than 7 seconds
  if(K.mode==='walk'&&K.kind!=='gym'&&now-(K.since||now)>7000)kMode('rest',1000+Math.random()*1500);
  if(!calm){
    if(K.mode==='walk'){
      if(K.kind==='fall'||K.tx!=null||K.kind==='ball'||K.kind==='gym'){
        const tx=kTarget(),dx=tx-K.x,run=K.kind==='wander'?85:150;

function findFood(q){q=q.toLowerCase().trim();if(!q)return null;const q2=q.replace(/(es|s)$/,'');
  const nm=f=>f[0].toLowerCase();
  const L=ALLFOOD();
  return L.find(f=>nm(f)===q||nm(f)===q2)||L.find(f=>q.includes(nm(f))||q2.includes(nm(f)))||L.find(f=>q.length>3&&nm(f).includes(q))||null}
function estFor(name,cal,n){
  const db=findFood(name);

  if(cal){const cs=selF.length?selF.map(i=>CATP[i]):[[.25,.45,.30,2]];
    const a=[0,1,2,3].map(j=>cs.reduce((s,c)=>s+c[j],0)/cs.length);
    return{cal,p:r1(cal*a[0]/4),cb:r1(cal*a[1]/4),f:r1(cal*a[2]/9),fi:r1(cal/100*a[3]),src:selF.length?'your food types':'a balanced split'}}
  return null}

// turns an Open Food Facts product into [name, serving, cal, protein, carbs, fat, fiber, grams] for one serving
function offItem(x){if(!x)return null;const n=x.nutriments||{},nm=(x.product_name||x.product_name_en||'').trim();
  let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;if(k==null||!nm)return null;
  const g=+x.serving_quantity>0?+x.serving_quantity:100,s=g/100;
  const brand=(Array.isArray(x.brands)?x.brands[0]||'':(x.brands||'').split(',')[0]).trim();
  const short=nm.length>55?nm.slice(0,54).trim()+'…':nm;
  const name=short+(brand&&!nm.toLowerCase().includes(brand.toLowerCase())?' ('+brand.slice(0,25)+')':'');
  return[name,x.serving_size||'100 g',Math.round(k*s),r1((+n.proteins_100g||0)*s),r1((+n.carbohydrates_100g||0)*s),r1((+n.fat_100g||0)*s),r1((+n['fiber_100g']||0)*s),g]}

async function searchFood(){const q=document.getElementById('fname').value.trim();if(!q)return toast('Type a food or brand first 💕');
  if(/^\d{6,14}$/.test(q))return lookupBarcode(q);
  const tk=++srchTk,words=q.toLowerCase().split(/\s+/);
  FR=ALLFOOD().filter(f=>words.every(w=>f[0].toLowerCase().includes(w))).slice(0,6);drawFR(true);
  const url=host=>`https://${host}.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${OFF_F}`;
  try{let a=((await getJSON(url('us'))).products||[]).map(offItem).filter(Boolean);
    if(!a.length&&tk===srchTk)a=((await getJSON(url('world'))).products||[]).map(offItem).filter(Boolean);
    if(tk!==srchTk)return;
    // put products whose name contains more of the search words first (the database also matches countries, ingredients, etc.)
    const score=f=>words.filter(w=>f[0].toLowerCase().includes(w)).length;
    a=a.map((f,i)=>[f,score(f),i]).sort((x,y)=>y[1]-x[1]||x[2]-y[2]).map(x=>x[0]);
    const seen=new Set(FR.map(f=>f[0].toLowerCase()));
    FR=FR.concat(a.filter(f=>{const k=f[0].toLowerCase();if(seen.has(k))return false;seen.add(k);return true})).slice(0,20);
    drawFR(false,FR.length?'Tap a food to fill in its numbers.':'No matches. Try other words, or scan the barcode.')}
  catch(e){if(tk!==srchTk)return;drawFR(false,(FR.length?'Showing built-in foods only. ':'')+'Online search is not available right now. Check your connection, try again in a minute, or scan the barcode.')}}

let scan=null;
const loadScript=src=>new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('load'));document.head.appendChild(s)});
async function openScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return manualCode();
  closeScan();const sc=scan={done:false};
  const ov=document.createElement('div');ov.id='scanov';
  ov.innerHTML=`<div class="scanbox"><video id="scanvid" playsinline muted autoplay></video><div class="scanline"></div></div><div style="color:#fff;margin:12px;font-weight:700">Point the camera at the barcode 🐾</div><div class="row" style="justify-content:center"><button class="ghost" onclick="manualCode()">Type the number</button><button onclick="closeScan()">Cancel</button></div>`;
  document.body.appendChild(ov);
  const found=code=>{if(sc.done)return;closeScan();if(navigator.vibrate)navigator.vibrate(60);lookupBarcode(code)};
  try{
    if('BarcodeDetector'in window&&(await BarcodeDetector.getSupportedFormats()).includes('ean_13')){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      sc.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      if(sc.done){sc.stream.getTracks().forEach(t=>t.stop());return}
      const v=document.getElementById('scanvid');v.srcObject=sc.stream;await v.play();
      const loop=async()=>{if(sc.done)return;try{const c=await det.detect(v);if(c.length)return found(c[0].rawValue)}catch(e){}sc.t=setTimeout(loop,200)};loop();
    }else{
      await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');if(sc.done)return;
      sc.zx=new ZXing.BrowserMultiFormatReader();
      await sc.zx.decodeFromVideoDevice(undefined,'scanvid',res=>{if(res)found(res.getText())});
      if(sc.done)try{sc.zx.reset()}catch(e){}
    }
  }catch(e){if(!sc.done){closeScan();toast('Camera not available. You can type the barcode number 💕');manualCode()}}}
function closeScan(){const sc=scan;scan=null;if(sc){sc.done=true;clearTimeout(sc.t);if(sc.stream)sc.stream.getTracks().forEach(t=>t.stop());try{sc.zx&&sc.zx.reset()}catch(e){}}

function logWeight(){const w=+document.getElementById('wt').value;if(!(w>20&&w<1000))return toast('Enter a valid weight 💕');
  const t=today(),e=S.weights.find(x=>x.d===t);if(e){e.w=w;save();toast('Updated ⚖️');return render()}
  S.weights.push({d:t,w});award(8,1,'⚖️ Weigh-in!')}
function saveProfile(){const v=id=>document.getElementById(id).value;S.profile={age:v('pa'),sex:v('ps'),ft:v('pf'),inch:v('pi'),act:+v('pact'),goal:+v('pg'),calOverride:v('pco')};save();toast('Targets updated 🎯');render()}
function spark(){const w=S.weights.slice(-30);if(w.length<2)return'';const min=Math.min(...w.map(x=>x.w))-1,max=Math.max(...w.map(x=>x.w))+1;
  const pts=w.map((x,i)=>`${i/(w.length-1)*300},${60-(x.w-min)/(max-min)*55}`).join(' ');
  return`<svg viewBox="0 0 300 64" style="width:100%;margin:8px 0"><polyline points="${pts}" fill="none" stroke="#ff7eb6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="prop p-swim"><path class="wave" d="M-20 74 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V100 H-20Z" fill="#8fd3ff" opacity=".65"/></g>
        <g class="prop p-dumb"><g class="db"><path d="M108 76 H136" stroke="#5a2a47" stroke-width="3.5" stroke-linecap="round"/><rect x="104" y="68" width="6" height="16" rx="2" fill="#7a3b5a"/><rect x="134" y="68" width="6" height="16" rx="2" fill="#7a3b5a"/></g></g>
      </svg>`}
function setMood(i){const d=D(),first=d.mood===null;d.mood=i;first?award(8,1,'💭 Checked in!'):(save(),render())}
function saveGrat(){const v=document.getElementById('grat').value.trim();if(!v)return;const d=D(),first=!d.gratitude;d.gratitude=v;first?award(10,1,'📝 Lovely!'):(save(),toast('Saved 💌'))}
let breathing=false;
async function breathe(){if(breathing)return;breathing=true;const el=document.getElementById('breath');const w=ms=>new Promise(r=>setTimeout(r,ms));
  for(let i=1;i<=3;i++){if(!document.getElementById('breath'))break;el.textContent='Breathe in...';el.style.transform='scale(1.5)';await w(4000);el.textContent='Breathe out...';el.style.transform='scale(1)';await w(4000)}
  breathing=false;if(!document.getElementById('breath'))return;D().breath++;award(12,2,'🌬️ Calm!')}
function buy(e,p){if(S.gems<p)return toast('Not enough 💎 yet!');S.gems-=p;S.owned.push(e);S.hat=e;save();toast('New look! 💖');render()}
function wear(e){S.hat=e;save();render()}
function rename(){S.name=document.getElementById('pname').value.trim()||'Bloom';save();toast('Saved 💕');render()}

// ---------- games ----------
let game=null;
function rewardOK(k){const d=D();d.plays=d.plays||{};if((d.plays[k]||0)>=3)return false;d.plays[k]=(d.plays[k]||0)+1;d.games++;return true}
function startGame(){({mm:startMM,catch:()=>{},trivia:()=>tv?drawTV():startTrivia(),bubble:startBubble,spin:()=>{},simon:()=>{},whack:()=>{},react:()=>{},scramble:()=>ws?drawWS():startWS()})[game]()}

// heart catch
let cT=null,cS=null;
const GT=[];let wI=[];function later(fn,ms){const id=setTimeout(fn,ms);GT.push(id);return id}function clearGT(){GT.forEach(clearTimeout);GT.length=0}
function stopCatch(){clearInterval(cT);clearInterval(cS);cT=cS=null;clearGT();wI.forEach(clearInterval);wI=[]}
function startCatch(){stopCatch();const ar=document.getElementById('arena');ar.innerHTML='';let sc=0,t=20;
  const upd=()=>{document.getElementById('csc').textContent='Score: '+sc;document.getElementById('ctm').textContent=t+'s'};upd();
  cS=setInterval(()=>{const bad=Math.random()<.25,el=document.createElement('div');el.className='fall';el.textContent=bad?'🌧️':['💖','💗','🌸','⭐'][Math.random()*4|0];
    el.style.left=Math.random()*(ar.clientWidth-44)+'px';el.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    el.onpointerdown=()=>{if(el.dead)return;el.dead=1;sc=Math.max(0,sc+(bad?-2:1));el.textContent=bad?'💥':'✨';upd();setTimeout(()=>el.remove(),150)};
    el.onanimationend=()=>el.remove();ar.appendChild(el)},480);
  cT=setInterval(()=>{t--;upd();if(t<=0){stopCatch();ar.innerHTML='';
    if(rewardOK('catch'))award(5+sc,Math.min(6,Math.floor(sc/4)),`💖 Score ${sc}!`);else toast(`Score ${sc}! Rewards maxed for today 💕`)}},1000)}

// trivia
const QA=[["How much water is a common daily goal for adults?",["About 8 glasses","1 glass","20 glasses"],0],
["Which nutrient helps you feel full and repair muscle?",["Protein","Sugar","Salt"],0],
["Roughly how many hours of sleep do most adults need?",["4-5","7-9","12+"],1],
["Which of these is a good source of fiber?",["Oats and beans","White soda","Butter"],0],
["What does slow deep breathing help calm?",["Your stress response","Your bones","Your eyesight"],0],
["How much moderate exercise per week is commonly recommended?",["15 minutes","About 150 minutes","10 hours"],1],
["Which mineral helps keep bones strong?",["Calcium","Lead","Helium"],0],
["Strength training can help build...",["Muscle and bone density","Taller height","Faster hair growth"],0],
["Which habit often helps mood?",["Daylight and a walk","Skipping all meals","Staying up all night"],0],
["Healthy fats are found in...",["Avocado and nuts","Motor oil","Candy"],0]];
let tv;
function startTrivia(){tv={q:[...QA].sort(()=>Math.random()-.5).slice(0,5),i:0,ok:0,lock:false};drawTV()}
function drawTV(){const el=document.getElementById('tv');if(!el)return;
  if(tv.i>=5){const ok=tv.ok;el.innerHTML=`<div style="text-align:center;font-size:20px;margin:12px">${ok}/5 correct ${ok>=4?'🌟':'💕'}</div><button onclick="startTrivia()" style="width:100%">Play again</button>`;
    if(tv.paid)return;tv.paid=1;if(rewardOK('trivia'))award(ok*4,ok>=4?4:ok>=2?2:0,'🧠 Smarty!');else toast('Rewards maxed for today 💕');return}
  const [q,o,a]=tv.q[tv.i];
  const order=o.map((t,i)=>i);
  el.innerHTML=`<div class="small">Question ${tv.i+1}/5</div><div style="font-weight:700;margin:6px 0">${q}</div>${o.map((t,i)=>`<button class="opt" onclick="ans(${i},this)">${t}</button>`).join('')}`}
function ans(i,b){if(tv.lock)return;tv.lock=true;const a=tv.q[tv.i][2];const bs=document.querySelectorAll('.opt');bs[a].classList.add('good');if(i===a)tv.ok++;else b.classList.add('bad');
  setTimeout(()=>{tv.i++;tv.lock=false;drawTV()},900)}

// bubble pop
let bb;
function startBubble(){const n=[...Array(12)].map((_,i)=>i+1).sort(()=>Math.random()-.5);bb={n,next:1,t0:0,iv:null};
  document.getElementById('bb').innerHTML=n.map(v=>`<div class="bub" id="b${v}" onclick="pop(${v})">${v}</div>`).join('');document.getElementById('bt').textContent='0.0s'}
function pop(v){if(v!==bb.next)return;if(v===1){bb.t0=Date.now();bb.iv=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=((Date.now()-bb.t0)/1000).toFixed(1)+'s'},100)}
  document.getElementById('b'+v).classList.add('gone');bb.next++;
  if(v===12){clearInterval(bb.iv);const s=(Date.now()-bb.t0)/1000;document.getElementById('bt').textContent=s.toFixed(1)+'s';
    if(rewardOK('bubble'))award(8,s<10?4:s<15?2:1,`🫧 ${s.toFixed(1)}s!`);else toast(`${s.toFixed(1)}s! Rewards maxed for today 💕`)}}

// lucky spin
function spin(){const d=D();d.plays=d.plays||{};if(d.plays.spin)return toast('Already spun today 💕');d.plays.spin=1;d.games++;
  const P=[['💎 +2',0,2],['💎 +3',0,3],['💎 +5',0,5],['✨ +15 XP',15,0],['✨ +25 XP',25,0],['💎 +10',0,10],['💎 +1 ✨ +10 XP',10,1]];
  const w=document.getElementById('wheel'),ic=['🎁','💎','✨','🌸','🍀','💖'];let n=0;
  const iv=setInterval(()=>{w.textContent=ic[n++%ic.length]},90);
  setTimeout(()=>{clearInterval(iv);const p=P[Math.random()*P.length|0];w.textContent='🎉';const r=document.getElementById('sres');if(r)r.textContent='You won '+p[0]+'!';award(p[1],p[2],'🎡 '+p[0])},1800)}

// sparkle sequence (Simon)
const SC=['#ff7eb6','#8fd3ff','#ffd166','#a8ecd0'];let sm;
const smMsg=t=>{const e=document.getElementById('smmsg');if(e)e.textContent=t};
function flashPad(i){const e=document.getElementById('sp'+i);if(!e)return;e.classList.add('lit');later(()=>e.classList.remove('lit'),350)}
function startSimon(){stopCatch();sm={seq:[],i:0,play:false,score:0};nextSimon()}
function nextSimon(){sm.seq.push(Math.random()*4|0);sm.i=0;sm.play=false;smMsg('Watch... Round '+sm.seq.length);let t=600;sm.seq.forEach(s=>{later(()=>flashPad(s),t);t+=600});later(()=>{sm.play=true;smMsg('Your turn!')},t)}
function tapSimon(i){if(!sm||!sm.play)return;flashPad(i);
  if(i!==sm.seq[sm.i]){sm.play=false;smMsg('Oops! Reached round '+(sm.score+1));if(rewardOK('simon'))award(5+sm.score*2,Math.min(6,Math.floor(sm.score/2)),'🎵 Round '+(sm.score+1));else toast('Rewards maxed for today 💕');return}
  sm.i++;if(sm.i===sm.seq.length){sm.score=sm.seq.length;sm.play=false;smMsg('Nice! 💕');later(nextSimon,800)}}

// whack-a-mouse
let wh;
function startWhack(){stopCatch();wh={s:0,t:20,up:-1,bad:false};
  const upd=()=>{const a=document.getElementById('whs'),b=document.getElementById('wht');if(a)a.textContent='Score: '+wh.s;if(b)b.textContent=wh.t+'s'};upd();
  document.querySelectorAll('[id^=wc]').forEach(e=>e.textContent='🕳️');
  const hide=i=>{const e=document.getElementById('wc'+i);if(e)e.textContent='🕳️'};
  wI.push(setInterval(()=>{if(wh.up>=0)hide(wh.up);const i=Math.random()*9|0;wh.up=i;wh.bad=Math.random()<.2;const e=document.getElementById('wc'+i);if(e)e.textContent=wh.bad?'🐶':'🐭';later(()=>{if(wh.up===i){hide(i);wh.up=-1}},650)},780));
  wI.push(setInterval(()=>{wh.t--;upd();if(wh.t<=0){const s=wh.s;stopCatch();if(rewardOK('whack'))award(5+s,Math.min(6,Math.floor(s/3)),`🐭 Score ${s}!`);else toast(`Score ${s}! Rewards maxed for today 💕`)}},1000))}
function tapWhack(i){if(!wh||wh.up!==i)return;wh.s=Math.max(0,wh.s+(wh.bad?-2:1));const e=document.getElementById('wc'+i);if(e)e.textContent=wh.bad?'💥':'✨';wh.up=-1;const a=document.getElementById('whs');if(a)a.textContent='Score: '+wh.s}

// word scramble
const WORDS=['PROTEIN','WATER','YOGA','STRETCH','BREATHE','SLEEP','FIBER','CARDIO','SMOOTHIE','HYDRATE','BALANCE','ENERGY','STRENGTH','MINDFUL','GRATEFUL','SPRINT','SALAD','WALKING'];
let ws;
const shuf=w=>{let s=w;for(let k=0;k<20&&s===w;k++)s=[...w].sort(()=>Math.random()-.5).join('');return s};
function startWS(){ws={w:[...WORDS].sort(()=>Math.random()-.5).slice(0,5),i:0,ok:0,paid:false};drawWS()}
function drawWS(){const el=document.getElementById('wsb');if(!el)return;
  if(ws.i>=5){el.innerHTML=`<div style="text-align:center;font-size:20px;margin:12px">${ws.ok}/5 solved ${ws.ok>=4?'🌟':'💕'}</div><button onclick="startWS()" style="width:100%">Play again</button>`;
    if(ws.paid)return;ws.paid=true;if(rewardOK('scramble'))award(ws.ok*4,ws.ok>=4?4:ws.ok>=2?2:0,'🔤 Word wiz!');else toast('Rewards maxed for today 💕');return}
  const w=ws.w[ws.i];ws.sc=ws.sc&&ws.sc.w===w?ws.sc:{w,s:shuf(w)};
  el.innerHTML=`<div class="small">Word ${ws.i+1}/5 · hint: starts with ${w[0]}</div><div style="font-size:30px;letter-spacing:6px;text-align:center;font-weight:700;margin:14px 0">${ws.sc.s}</div><input id="wsin" placeholder="Your answer" autocomplete="off" onkeydown="if(event.key==='Enter')checkWS()"><div class="row" style="margin-top:6px"><button onclick="checkWS()" style="flex:1">Check</button><button class="ghost" onclick="ws.i++;drawWS()">Skip</button></div>`;
  document.getElementById('wsin').focus()}
function checkWS(){const v=document.getElementById('wsin').value.trim().toUpperCase();if(!v)return;
  if(v===ws.w[ws.i]){ws.ok++;ws.i++;toast('Yes! ✨');drawWS()}else toast('Not quite, try again 💕')}

// quick paws (reaction)
let rx;
function startRx(){stopCatch();rx={times:[],state:'idle'};nextRx()}
function nextRx(){const el=document.getElementById('rxb');rx.state='wait';el.textContent='Wait for green... 🐾';el.style.background='#ffb3d4';
  later(()=>{if(!rx)return;rx.state='go';rx.t0=performance.now();el.textContent='TAP!';el.style.background='#7be0a8'},1000+Math.random()*3000)}
function tapRx(){const el=document.getElementById('rxb');if(!rx||rx.state==='done'){startRx();return}
  if(rx.state==='wait'){clearGT();rx.state='idle';el.textContent='Too soon! Tap to retry 🙈';el.style.background='#ffd0d0';return}
  if(rx.state==='idle'){nextRx();return}
  if(rx.state==='go'){const ms=Math.round(performance.now()-rx.t0);rx.times.push(ms);
    if(rx.times.length<3){rx.state='idle';el.textContent=`${ms} ms! Tap for next round`;el.style.background='#fff0b3';return}
    const avg=Math.round(rx.times.reduce((a,b)=>a+b)/3);rx.state='done';el.innerHTML=`Average ${avg} ms ${avg<350?'🔥':'💕'}<br><span style="font-size:14px">Tap to play again</span>`;el.style.background='#e6dbff';
    if(rewardOK('react'))award(8,avg<350?4:avg<500?2:1,`⚡ ${avg} ms!`);else toast('Rewards maxed for today 💕')}}

// memory game
let mm;
function startMM(){const em=['🌸','🍓','🦋','💖','🧁','🌈','⭐','🍑'];mm={cards:[...em,...em].sort(()=>Math.random()-.5).map(e=>({e,s:'d'})),open:[],moves:0,lock:false};drawMM()}
function drawMM(){const g=document.getElementById('mm');if(!g)return;g.innerHTML=mm.cards.map((c,i)=>`<div class="tile ${c.s==='o'?'up':c.s==='m'?'ok':''}" onclick="flip(${i})">${c.s==='d'?'❔':c.e}</div>`).join('');document.getElementById('mv').textContent='Moves: '+mm.moves}
function flip(i){if(mm.lock||mm.cards[i].s!=='d')return;mm.cards[i].s='o';mm.open.push(i);drawMM();
  if(mm.open.length===2){mm.moves++;const[a,b]=mm.open;mm.open=[];
    if(mm.cards[a].e===mm.cards[b].e){mm.cards[a].s=mm.cards[b].s='m';drawMM();
      if(mm.cards.every(c=>c.s==='m')){const d=D();if(rewardOK('mm')){const g=Math.max(1,Math.min(6,Math.round(26-mm.moves)/3|0));award(10,g,'🃏 Match!')}else toast('Cleared! Come back tomorrow for more rewards 💕')}}
    else{mm.lock=true;drawMM();setTimeout(()=>{mm.cards[a].s=mm.cards[b].s='d';mm.lock=false;drawMM()},800)}}}

// ---------- render ----------
let lastTab=null;
function render(){
  if(tab==='me'&&lastTab!=='me')setTimeout(kDance,0);lastTab=tab;
  if(typeof kHat==='function')kHat();
  setTimeout(()=>{if(tab==='move')upCb();if(typeof kAct==='function')kAct()},0);
  document.getElementById('app').innerHTML=hdr()+views[tab]();
  document.getElementById('nav').innerHTML=TABS.map(([k,e,n])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()"><span>${e}</span>${n}</button>`).join('');
  stopCatch();if(tab==='play'&&game)startGame();
}
render();
</script>
